<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiền công">
<meta name="theme-color" content="#5f8f82">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>Tiền công thợ may</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fffdf8;--ink:#2f3a36;--mut:#7b857f;--pri:#5f8f82;--pri-d:#487468;--pri-s:#dcebe5;--sand:#efe3cb;--sand-d:#a5854d;--line:#e7dfce;--danger:#b5645a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2421;--card:#262f2b;--ink:#e8ece9;--mut:#9aa6a0;--pri:#7fb3a5;--pri-d:#9bc9bb;--pri-s:#2f433d;--sand:#3a3427;--sand-d:#d4b779;--line:#35403b;--danger:#d98b80}}
:root[data-theme="dark"]{--bg:#1d2421;--card:#262f2b;--ink:#e8ece9;--mut:#9aa6a0;--pri:#7fb3a5;--pri-d:#9bc9bb;--pri-s:#2f433d;--sand:#3a3427;--sand-d:#d4b779;--line:#35403b;--danger:#d98b80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{min-height:640px;margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:19px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:12px;font-weight:400;color:var(--mut)}
h2{font-size:15px;margin:0 0 10px;color:var(--pri-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pri);color:#fff;border-color:transparent}
.hero .lbl{opacity:.9;font-size:14px}
.hero .big{font-size:30px;font-weight:700;margin-top:2px}
.sand{background:var(--sand);border-color:transparent}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.money{font-weight:600;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .t{font-weight:600;flex:1;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri-s);color:var(--pri-d);font-weight:600;min-height:44px}
button.pri{background:var(--pri);color:#fff}
button.ghost{background:transparent;color:var(--danger);padding:8px 10px;min-height:40px}
button.sq{width:44px;padding:0;font-size:22px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input[type=number]{-moz-appearance:textfield}
input.q{width:64px;text-align:center;font-weight:700;font-size:18px;padding:8px 4px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .nm{font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{display:flex;max-width:560px;width:100%;gap:4px}
.tabs button{flex:1;background:transparent;color:var(--mut);font-size:13px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px}
.tabs button span{font-size:19px;line-height:1}
.tabs button.on{background:var(--pri-s);color:var(--pri-d)}
.chart{width:100%;height:auto;display:block}
.bar{fill:var(--pri);cursor:pointer}
.bar.sel{fill:var(--sand-d)}
.ax{fill:var(--mut);font-size:9px;font-family:inherit}
.tip{min-height:22px;text-align:center;font-size:14px;color:var(--pri-d);font-weight:600;margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:10px}
.add button{grid-column:1/-1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;padding:8px 4px;line-height:1.25;font-size:15px}
.chip small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.on small{color:#fff;opacity:.9}
.sub{font-size:13px;opacity:.95;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.lab{font-size:13px;color:var(--mut);margin:10px 0 4px}
.accb{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;color:var(--ink);text-align:left;padding:4px 2px;min-height:48px;font-weight:400;gap:8px}
.accb b{display:block;font-size:16px}.accb small{display:block;font-size:12.5px;color:var(--mut);font-weight:400}
.chev{color:var(--pri-d);font-size:18px;flex:none}
.accc{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.accx{width:100%;margin-top:12px}
.card.sub{background:var(--bg);margin:8px 0 0;padding:8px 10px}
*{touch-action:manipulation}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.lbtn{display:flex;align-items:center;justify-content:center;background:var(--pri-s);color:var(--pri-d);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer;text-align:center;padding:0 8px}
.datebtn{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:600;text-align:center;min-height:44px;cursor:pointer}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;min-height:0;padding:0;border:0;margin:0}
.vbox{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.pill{padding:6px 14px;min-height:40px;border-radius:20px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.swb{width:38px;height:38px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.swb.on{box-shadow:0 0 0 3px var(--pri)}
.vchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-height:38px;border-radius:19px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;margin:4px 4px 0 0}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.chk input{width:22px;height:22px;min-height:0;padding:0}
input.cpick{width:50px;min-width:50px;flex:none;padding:3px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:#487468;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:transform .3s;max-width:90%;text-align:center;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
button,.chip,.pill,.swb,.vchip,.lbtn,.datebtn{position:relative;overflow:hidden;transition:transform .12s ease,box-shadow .15s,background-color .15s,opacity .12s;-webkit-tap-highlight-color:transparent}
button:active,.chip:active,.pill:active,.vchip:active,.lbtn:active,.datebtn:active{transform:scale(.94);opacity:.88}
.swb:active{transform:scale(.88)}
button.pri:active,.chip.on:active{box-shadow:inset 0 0 0 40px rgba(0,0,0,.12)}
.rip::after{content:'';position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.28;transform:translate(-50%,-50%) scale(0);animation:rp .55s ease-out;pointer-events:none}
@keyframes rp{to{transform:translate(-50%,-50%) scale(26);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes accin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#app.fadein{animation:fadein .28s ease-out}
.accnew .accc{animation:accin .22s ease-out}
.tabs button.on span{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.crow{padding:8px 0;border-top:1px dashed var(--line)}.crow:first-child{border-top:0}
.dot.big{width:22px;height:22px;flex:none}
.det{background:var(--bg);border-radius:12px;padding:4px 10px;margin-top:4px}.drow{padding:8px 0;border-top:1px solid var(--line)}.drow:first-child{border-top:0}
.cbtns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.cbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;min-height:42px;border-radius:21px;background:var(--bg);color:var(--ink);border:2px solid var(--line);font-weight:600}
.cbtn.on{border-color:var(--pri);background:var(--pri-s)}
.cbtn .cq{background:var(--pri);color:#fff;border-radius:11px;padding:0 8px;font-size:13px;min-width:22px;text-align:center;line-height:22px}
.cpanel{background:var(--bg);border-radius:12px;padding:10px;margin-top:6px}
.crow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.hist{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--bg);border-radius:12px;margin-bottom:8px;font-weight:400;color:var(--ink)}
.hist b{color:var(--pri-d)}
</style>
</head>

 else if(c==='adName'||c==='adAmt'){var ad=S.allowDef.filter(function(y){return y.id===id;})[0];if(ad){if(c==='adName')ad.name=t.value.trim()||ad.name;else ad.amt=Math.max(0,+t.value||0);var cm=today().slice(0,7);if(S.allow[cm]){S.allow[cm].forEach(function(r){if(r.id===id){r.name=ad.name;r.amt=ad.amt;}});}save();}}
 else if(c==='vqty'){var vo3=opById(id);if(vo3)setV(curDate,id,comboOf(vo3,t.dataset.cid),t.value);}
 else if(c==='zon'||c==='con'){var oo=opById(id);if(oo){if(c==='zon'){oo.zOn=t.checked;if(!oo.sizes)oo.sizes=[];}else{oo.cOn=t.checked;if(!oo.colors)oo.colors=[];}save();}}
 else if(c==='sizes'){var oz=opById(id);if(oz){var seenZ={};oz.sizes=t.value.split(',').map(function(x){return x.trim();}).filter(function(x){if(!x||seenZ[x])return false;seenZ[x]=1;return true;});save();}}
 else if(c==='colsizes'){var ocs=opById(id);if(ocs){var cl2=(ocs.colors||[]).filter(function(x){return x.id===t.dataset.cid;})[0];if(cl2){var seenC={},sz=t.value.split(',').map(function(x){return x.trim();}).filter(function(x){if(!x||seenC[x])return false;seenC[x]=1;return true;});if(sz.length)cl2.sizes=sz;else delete cl2.sizes;save();}}}
 else if(c==='colhex'||c==='colname'){var ocl=opById(id);if(ocl){var cl=(ocl.colors||[]).filter(function(x){return x.id===t.dataset.cid;})[0];if(cl){if(c==='colhex')cl.hex=hexOk(t.value);else cl.name=t.value.trim()||cl.name;save();}}}
 else if(c==='qty')setQty(curDate,id,t.value);
 else if(c==='stname'){var sx=S.styles.filter(function(y){return y.id===id;})[0];if(sx&&t.value.trim()){sx.name=t.value.trim();save();}}
 else if(c==='opname'){var o=S.ops.filter(function(x){return x.id===id;})[0];if(o&&t.value.trim()){o.name=t.value.trim();save();}}
 else if(c==='opprice'){var o2=S.ops.filter(function(x){return x.id===id;})[0];if(o2){o2.price=Math.max(0,+t.value||0);var td=today();for(var d in S.logs)if(d>=td&&S.logs[d][id])S.logs[d][id].p=o2.price;save();}}
 else if(c==='alname'){var x=ensureAllow(curMonth).filter(function(y){return y.id===id;})[0];if(x){x.name=t.value.trim()||x.name;save();}}
 else if(c==='alamt'){var x2=ensureAllow(curMonth).filter(function(y){return y.id===id;})[0];if(x2){x2.amt=Math.max(0,+t.value||0);save();}}
 render();});

render();

try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
})();
