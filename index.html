<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiền công">
<meta name="theme-color" content="#5f8f82">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tiền công thợ may</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fffdf8;--ink:#2f3a36;--mut:#7b857f;--pri:#5f8f82;--pri-d:#487468;--pri-s:#dcebe5;--sand:#efe3cb;--sand-d:#a5854d;--line:#e7dfce;--danger:#b5645a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2421;--card:#262f2b;--ink:#e8ece9;--mut:#9aa6a0;--pri:#7fb3a5;--pri-d:#9bc9bb;--pri-s:#2f433d;--sand:#3a3427;--sand-d:#d4b779;--line:#35403b;--danger:#d98b80}}
:root[data-theme="dark"]{--bg:#1d2421;--card:#262f2b;--ink:#e8ece9;--mut:#9aa6a0;--pri:#7fb3a5;--pri-d:#9bc9bb;--pri-s:#2f433d;--sand:#3a3427;--sand-d:#d4b779;--line:#35403b;--danger:#d98b80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{min-height:640px;margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:19px;margin:6px 2px 12px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:12px;font-weight:400;color:var(--mut)}
h2{font-size:15px;margin:0 0 10px;color:var(--pri-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pri);color:#fff;border-color:transparent}
.hero .lbl{opacity:.9;font-size:14px}
.hero .big{font-size:30px;font-weight:700;margin-top:2px}
.sand{background:var(--sand);border-color:transparent}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.money{font-weight:600;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .t{font-weight:600;flex:1;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pri-s);color:var(--pri-d);font-weight:600;min-height:44px}
button.pri{background:var(--pri);color:#fff}
button.ghost{background:transparent;color:var(--danger);padding:8px 10px;min-height:40px}
button.sq{width:44px;padding:0;font-size:22px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input[type=number]{-moz-appearance:textfield}
input.q{width:64px;text-align:center;font-weight:700;font-size:18px;padding:8px 4px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .nm{font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{display:flex;max-width:560px;width:100%;gap:4px}
.tabs button{flex:1;background:transparent;color:var(--mut);font-size:13px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px}
.tabs button span{font-size:19px;line-height:1}
.tabs button.on{background:var(--pri-s);color:var(--pri-d)}
.chart{width:100%;height:auto;display:block}
.bar{fill:var(--pri);cursor:pointer}
.bar.sel{fill:var(--sand-d)}
.ax{fill:var(--mut);font-size:9px;font-family:inherit}
.tip{min-height:22px;text-align:center;font-size:14px;color:var(--pri-d);font-weight:600;margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:10px}
.add button{grid-column:1/-1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;padding:8px 4px;line-height:1.25;font-size:15px}
.chip small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.on small{color:#fff;opacity:.9}
.sub{font-size:13px;opacity:.95;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.lab{font-size:13px;color:var(--mut);margin:10px 0 4px}
.accb{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;color:var(--ink);text-align:left;padding:4px 2px;min-height:48px;font-weight:400;gap:8px}
.accb b{display:block;font-size:16px}.accb small{display:block;font-size:12.5px;color:var(--mut);font-weight:400}
.chev{color:var(--pri-d);font-size:18px;flex:none}
.accc{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.accx{width:100%;margin-top:12px}
.card.sub{background:var(--bg);margin:8px 0 0;padding:8px 10px}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.lbtn{display:flex;align-items:center;justify-content:center;background:var(--pri-s);color:var(--pri-d);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer;text-align:center;padding:0 8px}
.datebtn{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:600;text-align:center;min-height:44px;cursor:pointer}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;min-height:0;padding:0;border:0;margin:0}
.hist{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--bg);border-radius:12px;margin-bottom:8px;font-weight:400;color:var(--ink)}
.hist b{color:var(--pri-d)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧵 Tiền công của tôi <small id="st"></small></h1>
  <div id="app"></div>
</div>
<div class="tabs"><div id="tabs"></div></div>
<script>
(function(){
var KEY='thomay_v1';
var DEF={mealPrice:20000,name:'',otRate:12000,sunBonus:200000,baseSalary:6000000,workDays:26};
function defAllow(){return[{id:'a1',name:'Phụ cấp',amt:0},{id:'a2',name:'Trách nhiệm',amt:0},{id:'a3',name:'Chuyên cần',amt:0}];}
function defLeaves(){return[{id:'l1',name:'Việc riêng',amt:0},{id:'l2',name:'Đau ốm',amt:0},{id:'l3',name:'Nghỉ phép có lương',amt:0}];}
function defShifts(){return[{id:'s1',t:'16:30',ot:0,meals:1},{id:'s2',t:'18:00',ot:1.5,meals:1},{id:'s3',t:'20:30',ot:3.5,meals:2}];}
function norm(d){d=d||{};var st={};for(var k in DEF)st[k]=(d.settings&&d.settings[k]!=null)?d.settings[k]:DEF[k];if(!(d.settings&&d.settings.ver===2)){st.otRate=(d.settings&&+d.settings.otRate)||12000;}st.ver=2;
 var r={ops:d.ops||[],logs:d.logs||{},allow:d.allow||{},meta:d.meta||{},settings:st,shifts:d.shifts||defShifts(),allowDef:d.allowDef||defAllow(),leaves:(d.leaves||defLeaves()).map(function(x){if(x.amt==null){x.amt=x.pct?Math.round((+st.baseSalary||0)/wd(dstr(new Date()))*x.pct/100):0;}delete x.pct;return x;}),styles:d.styles?d.styles:[{id:'st1',name:'Mã hàng 1'}],lastBackup:d.lastBackup||0,updated:d.updated||0};r.ops.forEach(function(o){if(!o.s&&r.styles.length)o.s=r.styles[0].id;});
 var cm0=dstr(new Date()).slice(0,7);r.styles.forEach(function(st){if(!st.months){var ms={};for(var dd in r.logs){var lg0=r.logs[dd];for(var kk in lg0){var en0=lg0[kk],op0=null;for(var ii=0;ii<r.ops.length;ii++)if(r.ops[ii].id===kk)op0=r.ops[ii];if((en0.s||(op0&&op0.s))===st.id)ms[dd.slice(0,7)]=1;}}ms[cm0]=1;st.months=Object.keys(ms).sort();}});for(var q in r.meta){var mm=r.meta[q];if(mm.type==='hol'&&!mm.v4){mm.hb=Math.round((+st.baseSalary||0)/wd(q));mm.v4=1;}}return r;}
var S=norm({});
try{var raw=localStorage.getItem(KEY);if(raw)S=norm(JSON.parse(raw));}catch(e){}
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dstr(new Date());}
function addDays(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return dstr(d);}
function addMonths(ym,n){var p=ym.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return Math.round(n).toLocaleString('vi-VN')+' đ';}
function hr(n){return String(n).replace('.',',');}
function short(n){return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'tr':n>=1e3?Math.round(n/1e3)+'k':''+Math.round(n);}
function mlabel(ym){var p=ym.split('-');return 'Tháng '+(+p[1])+'/'+p[0];}
function dlabel(s){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);var w=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][d.getDay()];return w+', '+(+p[2])+'/'+(+p[1])+'/'+p[0];}
var view='today',curDate=today(),curMonth=curDate.slice(0,7),selBar=null;

/* ---- tính toán ---- */
function dayType(d){var m=S.meta[d];if(m&&m.type)return m.type;var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getDay()===0?'sun':'norm';}
function wd(d){var p=d.split('-'),y=+p[0],mo=+p[1],n=new Date(y,mo,0).getDate(),c=0;for(var i=1;i<=n;i++)if(new Date(y,mo-1,i).getDay()!==0)c++;return c;}
function snap(d){var m=S.meta[d];if(!m)return;var T=S.settings;m.mp=+T.mealPrice||0;m.or=+T.otRate||0;m.sb=+T.sunBonus||0;m.hb=Math.round((+T.baseSalary||0)/wd(d));}
function ensureMeta(d){if(!S.meta[d]){S.meta[d]={};snap(d);}return S.meta[d];}
function isWork(d){var m=S.meta[d];return !!(S.logs[d]||(m&&(m.sh||m.type==='sun')));}
function worked(d){var m=S.meta[d];return isWork(d)||!!(m&&(m.type==='hol'||m.lv));}
function dayParts(d){var lg=S.logs[d],piece=0;if(lg)for(var k in lg)piece+=lg[k].q*lg[k].p;
 var T=S.settings,m=S.meta[d]||{},t=dayType(d),hrs=m.ot||0,ot=hrs*(m.or!=null?m.or:(+T.otRate||0)),
 meal=(m.meals||0)*(m.mp!=null?m.mp:(+T.mealPrice||0)),bonus=0;
 if(t==='sun'&&(lg||m.sh||m.type==='sun'))bonus=m.sb!=null?m.sb:(+T.sunBonus||0);
 else if(t==='hol')bonus=m.hb!=null?m.hb:Math.round((+T.baseSalary||0)/wd(d));
 var lp=(m.lv&&m.lvp!=null)?(+m.lvp||0):0;
 return{piece:piece,ot:ot,hrs:hrs,bonus:bonus,meal:meal,leave:lp,total:piece+ot+bonus+meal+lp};}
function dayTotal(d){return dayParts(d).total;}
function monthSum(ym){var r={piece:0,ot:0,hrs:0,bonus:0,meal:0,leave:0,total:0,days:0,sun:0,hol:0,leaveDays:0,leaveBy:{}},seen={};
 [S.logs,S.meta].forEach(function(o){for(var d in o){if(d.indexOf(ym)!==0||seen[d]||!worked(d))continue;seen[d]=1;var p=dayParts(d),m=S.meta[d]||{};
  r.piece+=p.piece;r.ot+=p.ot;r.hrs+=p.hrs;r.bonus+=p.bonus;r.meal+=p.meal;r.leave+=p.leave;r.total+=p.total;if(isWork(d))r.days++;var t=dayType(d);if(t==='sun'&&isWork(d))r.sun++;if(t==='hol')r.hol++;
  if(m.lv){r.leaveDays++;var n=m.lvn||'Nghỉ';r.leaveBy[n]=(r.leaveBy[n]||0)+1;}}});return r;}
function hasWork(ym){for(var d in S.logs)if(d.indexOf(ym)===0)return true;for(var e in S.meta)if(e.indexOf(ym)===0&&worked(e))return true;return false;}
function allowList(ym){if(S.allow[ym])return S.allow[ym];var w=hasWork(ym);return S.allowDef.map(function(x){return{id:x.id,name:x.name,amt:w?(+x.amt||0):0};});}
function ensureAllow(ym){if(!S.allow[ym])S.allow[ym]=allowList(ym).map(function(x){return{id:x.id,name:x.name,amt:x.amt};});return S.allow[ym];}
function monthAllow(ym){return allowList(ym).reduce(function(a,x){return a+(+x.amt||0);},0);}
function monthTotal(ym){return monthSum(ym).total+monthAllow(ym);}
var curStyle=null,openSec='',openSty='',showCode=false,bkCode='';
function styleName(id,fb){for(var i=0;i<S.styles.length;i++)if(S.styles[i].id===id)return S.styles[i].name;return fb||'(đã xóa)';}
function visStyles(ym){return S.styles.filter(function(x){return !x.months||x.months.indexOf(ym)>=0;});}
var setMonth=dstr(new Date()).slice(0,7);
function curSty(){var v=visStyles(curDate.slice(0,7));if(!v.some(function(x){return x.id===curStyle;}))curStyle=v.length?v[0].id:'';return curStyle;}
function opName(id,fb){for(var i=0;i<S.ops.length;i++)if(S.ops[i].id===id)return S.ops[i].name;return fb||'(đã xóa)';}
function breakdown(ym){var g={};for(var d in S.logs){if(d.indexOf(ym)!==0)continue;var o=S.logs[d];for(var k in o){var en=o[k],op=S.ops.filter(function(x){return x.id===k;})[0],sid=en.s||(op&&op.s)||'';
  var G=g[sid]||(g[sid]={sid:sid,name:styleName(sid,en.sn),ops:{},q:0,t:0});
  var e=G.ops[k]||(G.ops[k]={id:k,name:opName(k,en.n),q:0,t:0,ps:{}});e.q+=en.q;e.t+=en.q*en.p;e.ps[en.p]=1;G.q+=en.q;G.t+=en.q*en.p;}}
 var order=S.styles.map(function(x){return x.id;});
 return Object.keys(g).sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);}).map(function(sid){var G=g[sid];G.ops=Object.keys(G.ops).map(function(k){return G.ops[k];}).sort(function(a,b){return b.t-a.t;});return G;});}
function allMonths(){var s={};for(var d in S.logs)s[d.slice(0,7)]=1;for(var d2 in S.meta)if(worked(d2))s[d2.slice(0,7)]=1;for(var m in S.allow)if(allowList(m).length)s[m]=1;return Object.keys(s).sort().reverse();}

/* ---- lưu ---- */
var dbDoc=null,tmr=null;
function save(){[curDate.slice(0,7),curMonth].forEach(function(y){if(!S.allow[y]&&hasWork(y))ensureAllow(y);});S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}status('Đã lưu');if(dbDoc){clearTimeout(tmr);tmr=setTimeout(pushDb,700);}}
function pushDb(){if(!dbDoc)return;dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){status('Đã lưu ☁');}).catch(function(){status('Đã lưu trên máy');});}
function status(t){var e=document.getElementById('st');if(e)e.textContent=t;}
(function(){try{if(!window.claude||!claude.use)return;
 Promise.all([claude.use('db'),claude.use('user')]).then(function(r){var db=r[0],user=r[1];if(!db||!user)return;
  return user.id().then(function(id){if(!id)return;dbDoc=db.collection('data/users/'+id).doc('thomay');
   return dbDoc.get().then(function(s){if(s.exists){var d=norm(JSON.parse(JSON.stringify(s.data())));
     if(d.updated>S.updated){S=d;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}else if(S.updated>d.updated)pushDb();}
    else if(S.updated)pushDb();status('Đã đồng bộ ☁');});});
 }).catch(function(){});}catch(e){}})();

/* ---- sao lưu (nén mã cho ngắn) ---- */
function toB64(buf){var b=new Uint8Array(buf),t='';for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function fromB64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var q=atob(t),b=new Uint8Array(q.length);for(var i=0;i<q.length;i++)b[i]=q.charCodeAt(i);return b;}
function pack(str){if(!window.CompressionStream)return Promise.resolve(str);var cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();return new Response(cs.readable).arrayBuffer().then(function(b){return 'TC1:'+toB64(b);});}
function unpack(code){if(code.indexOf('TC1:')!==0)return Promise.resolve(code);var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(fromB64(code.slice(4)));w.close();return new Response(ds.readable).text();}
function fillBackup(){pack(JSON.stringify(S)).then(function(c){bkCode=c;var t=document.getElementById('bk');if(t)t.value=c;}).catch(function(){bkCode=JSON.stringify(S);var t=document.getElementById('bk');if(t)t.value=bkCode;});}
/* ---- thao tác ---- */
function setQty(d,id,q){q=Math.max(0,Math.floor(+q||0));var op=S.ops.filter(function(o){return o.id===id;})[0];if(!op)return;
 ensureMeta(d);var day=S.logs[d]||(S.logs[d]={});
 if(q===0){delete day[id];if(!Object.keys(day).length)delete S.logs[d];}
 else day[id]={q:q,p:day[id]?day[id].p:op.price,n:op.name,s:op.s,sn:styleName(op.s)};
 save();}
function getQty(d,id){var o=S.logs[d];return o&&o[id]?o[id].q:0;}

/* ---- biểu đồ ---- */
function chart(data,id){var W=320,H=140,L=4,B=18,T=14,n=data.length,max=Math.max.apply(null,data.map(function(x){return x.v;}).concat([1]));
 var bw=(W-L*2)/n,s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
 s+='<line x1="0" y1="'+(H-B)+'" x2="'+W+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
 s+='<text class="ax" x="'+L+'" y="9">'+short(max)+'</text>';
 data.forEach(function(x,i){var h=x.v?Math.max(2,(x.v/max)*(H-B-T)):0,xx=L+i*bw,sel=selBar===id+':'+x.k;
  s+='<rect class="bar'+(sel?' sel':'')+'" data-a="bar" data-k="'+id+':'+x.k+'" data-tip="'+esc(x.tip)+'" x="'+(xx+bw*.12)+'" y="'+(H-B-h)+'" width="'+(bw*.76)+'" height="'+Math.max(h,0)+'" rx="2"/>';
  s+='<rect data-a="bar" data-k="'+id+':'+x.k+'" data-tip="'+esc(x.tip)+'" x="'+xx+'" y="0" width="'+bw+'" height="'+(H-B)+'" fill="transparent"/>';
  if(x.lab)s+='<text class="ax" text-anchor="middle" x="'+(xx+bw/2)+'" y="'+(H-5)+'">'+x.lab+'</text>';});
 return s+'</svg><div class="tip" id="tip-'+id+'">'+(selBar&&selBar.indexOf(id+':')===0?esc(tipOf(id)):'Chạm vào cột để xem số tiền')+'</div>';}
var tips={};function tipOf(id){return tips[id]||'';}

/* ---- bảng lương ---- */
var slipUrls={},slipKind='luong';
function slipRows(ym){var R=monthSum(ym),A=allowList(ym),Am=monthAllow(ym),B=breakdown(ym),rows=[];
 if(!B.length){rows.push({t:'sec',c:['Tiền công sản phẩm']});rows.push({t:'row',c:['(chưa có dữ liệu)','','','']});}

/* ---- tắt zoom ---- */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==='tab'){view=b.dataset.v;selBar=null;}

 else if(a==='dnext')curDate=addDays(curDate,1);

 else if(a==='dec')setQty(curDate,id,getQty(curDate,id)-1);
 else if(a==='shift'){var m0=ensureMeta(curDate);if(m0.sh===id){m0.sh=null;m0.t='';m0.ot=0;m0.meals=0;}else{var x0=S.shifts.filter(function(y){return y.id===id;})[0];if(x0){m0.sh=id;m0.t=x0.t;m0.ot=+x0.ot||0;m0.meals=+x0.meals||0;}}snap(curDate);save();}

 else if(a==='delshift'){S.shifts=S.shifts.filter(function(y){return y.id!==id;});save();}
 else if(a==='leave'){var m2=ensureMeta(curDate);if(m2.lv===id){delete m2.lv;delete m2.lvn;delete m2.lvp;}else{var lv=S.leaves.filter(function(y){return y.id===id;})[0];if(lv){m2.lv=id;m2.lvn=lv.name;m2.lvp=+lv.amt||0;}}save();}
 else if(a==='addleave'){var ln=document.getElementById('lvN').value.trim();if(!ln){document.getElementById('lvN').focus();return;}S.leaves.push({id:uid(),name:ln,amt:Math.max(0,+document.getElementById('lvP').value||0)});save();}
 else if(a==='delleave'){S.leaves=S.leaves.filter(function(y){return y.id!==id;});save();}
 else if(a==='gotoday'){curDate=b.dataset.d;view='today';selBar=null;}
 else if(a==='copybk'){var ta=document.getElementById('bk');ta.select();ta.setSelectionRange(0,ta.value.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(function(){});status('Đã sao chép mã');return;}
 else if(a==='sharebk'){var tb=document.getElementById('bk');if(navigator.share)navigator.share({title:'Sao lưu tiền công',text:tb.value}).catch(function(){});else status('Hãy bấm Sao chép mã');return;}
 else if(a==='restore'){var tv=document.getElementById('rs').value.trim();if(!tv)return;unpack(tv).then(function(txt){var nd=norm(JSON.parse(txt));if(!confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;S=nd;save();render();}).catch(function(){alert('Nội dung sao lưu không hợp lệ.');});return;}
 else if(a==='slip'){view='slip';}
 else if(a==='saveslip'){var kd=slipKind,nm=(kd==='cong'?'bang-cong-':'bang-luong-')+curMonth+'.png';try{var f0=dataFile(slipUrls[kd],nm);if(navigator.canShare&&navigator.canShare({files:[f0]})){navigator.share({files:[f0],title:(kd==='cong'?'Bảng công ':'Bảng lương ')+mlabel(curMonth)}).catch(function(){});return;}}catch(e){}
   var al=document.createElement('a');al.href=slipUrls[kd];al.download=nm;document.body.appendChild(al);al.click();al.remove();status('Nếu chưa thấy hộp lưu, hãy nhấn giữ vào ảnh');return;}
  else if(a==='saveboth'){try{var fs=[dataFile(slipUrls.luong,'bang-luong-'+curMonth+'.png'),dataFile(slipUrls.cong,'bang-cong-'+curMonth+'.png')];if(navigator.canShare&&navigator.canShare({files:fs})){navigator.share({files:fs,title:'Bảng lương và bảng công '+mlabel(curMonth)}).catch(function(){});return;}}catch(e){}status('Máy này chưa lưu được 2 ảnh cùng lúc, hãy lưu từng ảnh');return;}
  else if(a==='slipk'){slipKind=b.dataset.k;}
  else if(a==='mprev'){curMonth=addMonths(curMonth,-1);selBar=null;}
 else if(a==='mnext'){curMonth=addMonths(curMonth,1);selBar=null;}
 else if(a==='gomonth'){curMonth=b.dataset.m;view='month';selBar=null;}
 else if(a==='bar'){selBar=b.dataset.k;var cid=selBar.split(':')[0];tips[cid]=b.dataset.tip;render();return;}

 else if(a==='style'){curStyle=id;}
 else if(a==='delday'){var zt=dayTotal(curDate),zq=curDate.split('-');if(!confirm('Xóa toàn bộ dữ liệu ngày '+zq[2]+'/'+zq[1]+'/'+zq[0]+'?\nGồm số lượng, giờ tan ca, cơm, loại ngày và ngày nghỉ. Số tiền '+fmt(zt)+' của ngày này cũng bị xóa, không khôi phục được.'))return;
  delete S.logs[curDate];delete S.meta[curDate];var zym=curDate.slice(0,7);if(!hasWork(zym))delete S.allow[zym];save();}
 else if(a==='togcode'){showCode=!showCode;}
 else if(a==='savebk'){var nmb='tien-cong-sao-luu-'+today()+'.txt';
  var doSave=function(code){var f=new File([code],nmb,{type:'text/plain'});var done=function(){S.lastBackup=Date.now();save();render();};
   if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Sao lưu tiền công'}).then(done).catch(function(){});}
   else{var u=URL.createObjectURL(f),al2=document.createElement('a');al2.href=u;al2.download=nmb;document.body.appendChild(al2);al2.click();al2.remove();setTimeout(function(){URL.revokeObjectURL(u);},3000);done();}};
  if(bkCode)doSave(bkCode);else pack(JSON.stringify(S)).then(doSave);return;}
 else if(a==='acc'){var kk=b.dataset.k;if(b.dataset.l==='s')openSty=(openSty===kk?'':kk);else{openSec=(openSec===kk?'':kk);if(openSec!=='ma')openSty='';}}
 else if(a==='addstyle'){var sn=document.getElementById('nsn').value.trim();if(!sn){document.getElementById('nsn').focus();return;}var ns={id:uid(),name:sn,months:[setMonth]};S.styles.push(ns);curStyle=ns.id;openSec='ma';openSty=ns.id;save();}
 else if(a==='delstyle'){var zn=styleName(id),zsum=0,zsid=function(en,k){return en.s||((S.ops.filter(function(o){return o.id===k;})[0]||{}).s);};
  for(var zd in S.logs)if(zd.indexOf(setMonth)===0){var zl=S.logs[zd];for(var zk in zl)if(zsid(zl[zk],zk)===id)zsum+=zl[zk].q*zl[zk].p;}
  if(!confirm('Xóa mã hàng "'+zn+'" trong '+mlabel(setMonth).toLowerCase()+'?\nToàn bộ số lượng đã nhập và '+fmt(zsum)+' tiền công của mã hàng này trong tháng này cũng bị xóa vĩnh viễn, không khôi phục được.'))return;
  for(var zd2 in S.logs)if(zd2.indexOf(setMonth)===0){var zl2=S.logs[zd2];for(var zk2 in zl2)if(zsid(zl2[zk2],zk2)===id)delete zl2[zk2];if(!Object.keys(zl2).length)delete S.logs[zd2];}
  var zst=S.styles.filter(function(y){return y.id===id;})[0];if(zst){zst.months=(zst.months||[]).filter(function(m){return m!==setMonth;});if(!zst.months.length){S.styles=S.styles.filter(function(y){return y.id!==id;});S.ops=S.ops.filter(function(o){return o.s!==id;});}}
  if(curStyle===id)curStyle=null;if(openSty===id)openSty='';save();}
 else if(a==='copystyles'){var cm2=b.dataset.m,pm2=addMonths(cm2,-1);visStyles(pm2).forEach(function(st){var nid2=uid();S.styles.push({id:nid2,name:st.name,months:[cm2]});S.ops.filter(function(o){return o.s===st.id;}).forEach(function(o){S.ops.push({id:uid(),name:o.name,price:o.price,s:nid2});});});openSec='ma';setMonth=cm2;save();}
 else if(a==='gosetup'){setMonth=b.dataset.m;view='ops';openSec='ma';openSty='';}
 else if(a==='smprev'){setMonth=addMonths(setMonth,-1);openSty='';}
 else if(a==='smnext'){setMonth=addMonths(setMonth,1);openSty='';}
 else if(a==='dupstyle'){var sn0=S.styles.filter(function(y){return y.id===id;})[0];if(!sn0)return;var nid=uid();S.styles.push({id:nid,name:sn0.name+' (bản sao)',months:[setMonth]});S.ops.filter(function(o){return o.s===id;}).forEach(function(o){S.ops.push({id:uid(),name:o.name,price:o.price,s:nid});});openSec='ma';openSty=nid;save();}
 else if(a==='delop'){var o=S.ops.filter(function(x){return x.id===id;})[0];if(o&&confirm('Xóa công đoạn "'+o.name+'"? Dữ liệu cũ vẫn được giữ trong lịch sử.')){S.ops=S.ops.filter(function(x){return x.id!==id;});save();}else return;}
 else if(a==='addallow'){var an=document.getElementById('aln').value.trim()||'Phụ cấp khác',am=+document.getElementById('ala').value||0;ensureAllow(curMonth).push({id:uid(),name:an,amt:am});save();}
 else if(a==='delallow'){S.allow[curMonth]=ensureAllow(curMonth).filter(function(x){return x.id!==id;});save();}
 else if(a==='addAD'){var dn=document.getElementById('adN').value.trim();if(!dn){document.getElementById('adN').focus();return;}S.allowDef.push({id:uid(),name:dn,amt:Math.max(0,+document.getElementById('adA').value||0)});save();}
 else if(a==='delAD'){S.allowDef=S.allowDef.filter(function(y){return y.id!==id;});save();}
 render();window.scrollTo(0,(a==='tab'||a==='gomonth'||a==='gosetup')?0:window.scrollY);

});

 if(c==='date'){if(t.value)curDate=t.value;}
 else if(c==='restorefile'){var fl=t.files&&t.files[0];if(!fl)return;var fr=new FileReader();fr.onload=function(){unpack(String(fr.result).trim()).then(function(txt){var nd=norm(JSON.parse(txt));if(!confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;S=nd;save();render();alert('Đã khôi phục dữ liệu.');}).catch(function(){alert('File sao lưu không hợp lệ.');});};fr.readAsText(fl);t.value='';return;}
  else if(c==='setname'){S.settings.name=t.value.trim();save();}
 else if(c==='set'){S.settings[t.dataset.k]=Math.max(0,+t.value||0);var td0=today();for(var d0 in S.meta)if(d0>=td0)snap(d0);save();}
 else if(c==='shT'||c==='shOt'||c==='shMeals'){var sh=S.shifts.filter(function(y){return y.id===id;})[0];if(sh){if(c==='shT')sh.t=t.value.trim()||sh.t;else if(c==='shOt')sh.ot=Math.max(0,+t.value||0);else sh.meals=Math.max(0,Math.floor(+t.value||0));save();}}
 else if(c==='dayprice'){var e1=S.logs[curDate]&&S.logs[curDate][id];if(e1){e1.p=Math.max(0,+t.value||0);save();}}
 else if(c==='mprice'){if(t.value===''){return;}var np=Math.max(0,+t.value||0);for(var d1 in S.logs)if(d1.indexOf(curMonth)===0&&S.logs[d1][id])S.logs[d1][id].p=np;save();}
 else if(c==='lvp'){var m3=ensureMeta(curDate);m3.lvp=Math.max(0,+t.value||0);save();}
 else if(c==='lvName'||c==='lvPct'){var lq=S.leaves.filter(function(y){return y.id===id;})[0];if(lq){if(c==='lvName')lq.name=t.value.trim()||lq.name;else lq.amt=Math.max(0,+t.value||0);save();}}
 else if(c==='adName'||c==='adAmt'){var ad=S.allowDef.filter(function(y){return y.id===id;})[0];if(ad){if(c==='adName')ad.name=t.value.trim()||ad.name;else ad.amt=Math.max(0,+t.value||0);var cm=today().slice(0,7);if(S.allow[cm]){S.allow[cm].forEach(function(r){if(r.id===id){r.name=ad.name;r.amt=ad.amt;}});}save();}}
 else if(c==='qty')setQty(curDate,id,t.value);
 else if(c==='stname'){var sx=S.styles.filter(function(y){return y.id===id;})[0];if(sx&&t.value.trim()){sx.name=t.value.trim();save();}}
 else if(c==='opname'){var o=S.ops.filter(function(x){return x.id===id;})[0];if(o&&t.value.trim()){o.name=t.value.trim();save();}}
 else if(c==='opprice'){var o2=S.ops.filter(function(x){return x.id===id;})[0];if(o2){o2.price=Math.max(0,+t.value||0);var td=today();for(var d in S.logs)if(d>=td&&S.logs[d][id])S.logs[d][id].p=o2.price;save();}}
 else if(c==='alname'){var x=ensureAllow(curMonth).filter(function(y){return y.id===id;})[0];if(x){x.name=t.value.trim()||x.name;save();}}
 else if(c==='alamt'){var x2=ensureAllow(curMonth).filter(function(y){return y.id===id;})[0];if(x2){x2.amt=Math.max(0,+t.value||0);save();}}
 render();});

render();

try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
})();
